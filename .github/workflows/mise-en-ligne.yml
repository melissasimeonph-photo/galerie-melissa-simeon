# Met le site en ligne sur Cloudflare à chaque envoi sur la branche main
name: Mise en ligne
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: mise-en-ligne
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Mise en ligne du Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
