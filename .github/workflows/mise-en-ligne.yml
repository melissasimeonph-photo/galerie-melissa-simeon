# Met le site en ligne sur Cloudflare à chaque envoi sur la branche main
name: Mise en ligne
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: mise-en-ligne
jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Mise en ligne du Worker
        env:
          JETON: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Retire les espaces ou retours à la ligne collés par erreur avec le jeton
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$JETON" | tr -d '[:space:]')"
          echo "Longueur du jeton : ${#CLOUDFLARE_API_TOKEN} caractères"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 300; echo
          npx wrangler deploy
