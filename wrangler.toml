name = "galerie-melissa-simeon"
account_id = "aee7281b36e64c5c945510d9db016f00"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Adresse du site (domaine personnalisé, certificat HTTPS automatique)
routes = [{ pattern = "galerie.melissa-simeon.com", custom_domain = true }]

# Pages statiques (interface client et photographe)
[assets]
directory = "public"
binding = "ASSETS"

# Photos : stockage Cloudflare R2
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "galerie-photos"

# Base de données : collections, sélections, activité
[[d1_databases]]
binding = "DB"
database_name = "galerie"
database_id = "019915aa-3a92-4bb5-af03-b16d15e00814"
migrations_dir = "migrations"

# Tâche quotidienne (9 h en Martinique) : relances, rappels d'expiration, archivage
[triggers]
crons = ["0 13 * * *"]

[vars]
DOMAINE = "galerie.melissa-simeon.com"
ADMIN_EMAIL = "melissasimeon.ph@gmail.com"
ADRESSE = "Résidence Grand Village, 97233 Schœlcher, Martinique"
EXPEDITEUR = "Mélissa Siméon Photographie <galerie@melissa-simeon.com>"
REPONSE_A = "melissasimeon.ph@gmail.com"
# Renseignés après la création de l'application Cloudflare Access :
ACCESS_EQUIPE = "raspy-violet-9a10"
ACCESS_AUD = "fa09a79f739555d0fa7550a5d107c973cfa0fe4ceccf7b53521393458b5e5918"
# Compteur de requêtes du jour (vue photographe) : identifiant du compte et limite de l'offre
CF_COMPTE = "aee7281b36e64c5c945510d9db016f00"
LIMITE_REQUETES = "100000"

# Secret à ajouter dans Cloudflare (Workers › galerie-melissa-simeon › Paramètres › Variables et secrets) :
#   RESEND_API_KEY  : clé d'envoi des e-mails
# La clé qui signe les accès clients est créée automatiquement (ou SESSION_SECRET si défini).
